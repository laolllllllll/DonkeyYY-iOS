name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project DonkeyYY.xcodeproj \
            -scheme DonkeyYY \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DonkeyYY.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DonkeyYY.xcarchive/Products/Applications/DonkeyYY.app build/Payload/
          cd build
          zip -r DonkeyYY.ipa Payload
          cd ..
          ls -lh build/DonkeyYY.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DonkeyYY.ipa
          path: build/DonkeyYY.ipa

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: DonkeyYY.app
          path: build/DonkeyYY.xcarchive/Products/Applications/DonkeyYY.app
