workflows:
  donkey_ios_build:
    name: DonkeyYY iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode Project
        script: |
          xcodegen generate
      - name: Build Archive
        script: |
          xcodebuild \
            -project DonkeyYY.xcodeproj \
            -scheme DonkeyYY \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DonkeyYY.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean archive
      - name: Package IPA
        script: |
          mkdir -p build/Payload
          cp -R build/DonkeyYY.xcarchive/Products/Applications/DonkeyYY.app build/Payload/
          cd build
          zip -qr DonkeyYY.ipa Payload
          cd ..
          cp build/DonkeyYY.ipa DonkeyYY.ipa
          cp -R build/DonkeyYY.xcarchive/Products/Applications/DonkeyYY.app DonkeyYY.app
          echo "Build complete!"
          ls -lh DonkeyYY.ipa
    artifacts:
      - DonkeyYY.ipa
      - DonkeyYY.app
