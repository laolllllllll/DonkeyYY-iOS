name: DonkeyYY
options:
  bundleIdPrefix: com.cor
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"
    ARCHS: "arm64"
    VALID_ARCHS: "arm64"
    ONLY_ACTIVE_ARCH: "NO"
    SKIP_INSTALL: "NO"
    INSTALL_PATH: "/Applications"

targets:
  DonkeyYY:
    type: application
    platform: iOS
    sources:
      - path: DonkeyYY
        excludes:
          - "Assets.xcassets"
    resources:
      - path: DonkeyYY/Assets.xcassets
      - path: DonkeyYY/logo.png
    info:
      path: DonkeyYY/Info.plist
      properties:
        CFBundleDisplayName: DonkeyYY
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryAddUsageDescription: 需要保存视频到相册
        NSPhotoLibraryUsageDescription: 需要访问相册保存视频
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cor.luoli
        INFOPLIST_FILE: DonkeyYY/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "NO"
